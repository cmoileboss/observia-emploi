name: Docker CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha
            type=semver,pattern={{version}}

      - name: Restore data files
        run: |
          if gh release download data-latest --pattern "data.tar.gz" --dir . --clobber 2>/dev/null; then
            mkdir -p ./backend/data
            tar -xzf data.tar.gz -C ./backend/data/
            echo "✓ Fichiers de données restaurés."
            rm data.tar.gz
          else
            echo "⚠ Release 'data-latest' introuvable, build sans données."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
